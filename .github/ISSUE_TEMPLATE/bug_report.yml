name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1.\n2.\n3."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Enveo version (Settings → About)
      placeholder: e.g. 2.2.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Self-hosted, Managed / cloud]
    validations:
      required: true
  - type: input
    id: browser-device
    attributes:
      label: Browser / device
      placeholder: e.g. Safari on iOS 17, installed PWA
    validations:
      required: true
