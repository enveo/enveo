# Enveo — self-hosting stack. Runs the PUBLISHED image; nothing is built here.
#
#   mkdir enveo && cd enveo
#   curl -fsSL https://raw.githubusercontent.com/enveo/enveo/main/compose.selfhost.yml -o compose.yml
#   curl -fsSL https://raw.githubusercontent.com/enveo/enveo/main/.env.selfhost.example -o .env
#   # fill in the two secrets in .env, then:
#   docker compose up -d
#
# Why the file is not called compose.yml IN THIS REPO: `docker compose` auto-loads
# compose.yml/compose.yaml before docker-compose.yml, so that name would shadow the
# development stack (docker-compose.yml — same thing, but BUILT from source) for
# everyone working on the code. Outside the repo the name does not matter: save it
# as compose.yml (as above) and every `docker compose …` command finds it with no -f.
#
# Backup:  docker compose exec -T db pg_dump -U enveo enveo | gzip > enveo-$(date +%F).sql.gz
# Update:  back up (line above), read the release notes, THEN
#          docker compose pull && docker compose up -d
#          — an update may migrate the database, so going back can mean restoring that
#            backup; see docs/operations.md before you run it.
#
# Run it from its OWN directory (as above), not from a checkout of the repo. Compose
# derives the project name — which is what ties containers and the data volume together
# — from the directory name, so running this file inside a repo that already has a
# stack up would take over that stack's containers and volume.
#
# EXPOSURE: the app is published on the host LOOPBACK only (127.0.0.1:8081) — reachable
# from the machine that runs it, not from the network. That default is deliberate: the
# FIRST person to reach the app claims the owner account (registration closes only once
# it exists), and a plain-HTTP origin issues session cookies without `Secure`. To reach
# it from other devices, do NOT just open the port: put it behind TLS (reverse proxy,
# tunnel, or mesh VPN) and set BETTER_AUTH_URL to that https:// origin. If you knowingly
# want it on the LAN anyway (NAS, home network), set ENVEO_BIND=0.0.0.0 in .env and
# create the owner account IMMEDIATELY. Docker's iptables rules bypass ufw/firewalld —
# a host firewall will not save you from a published port.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: enveo
      POSTGRES_DB: enveo
      # No default on purpose — an unset password must stop the stack, not start a
      # database with a guessable one. Generate: openssl rand -hex 24
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env next to this file — generate one with `openssl rand -hex 24`}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately NO `ports:` — the database is reachable only from the app over the
    # compose network. Add a mapping only for debugging, and only on 127.0.0.1.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enveo -d enveo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # `latest` is a MUTABLE alias. The release pipeline moves it onto a stable release only
    # after that exact image passed the full gate (multi-arch manifest, vulnerability scan,
    # provenance, SBOM); it never points at a prerelease, and it may cross a major version.
    # Nothing moves under you on its own: the first `up` fetches the image, and restarting an
    # existing install keeps running the image you already have. You advance deliberately —
    # back up, read the release notes, `docker compose pull`, then `docker compose up -d`
    # (docs/operations.md). Releases: github.com/enveo/enveo/releases
    image: ghcr.io/enveo/enveo:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

    # Container hardening. The image runs as the unprivileged `bun` user (uid 1000) with
    # root-owned application files; these lines close the container boundary. `init` gives a
    # PID 1 that forwards SIGTERM (clean stops), the API needs no Linux capability, no setuid
    # binary may raise privileges, and the root filesystem is immutable with /tmp — in RAM —
    # as the only writable path. Enveo writes no files: your data is in the `pgdata` volume.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    environment:
      DATABASE_URL: "postgres://enveo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env next to this file — generate one with `openssl rand -hex 24`}@db:5432/enveo"
      PORT: 8080
      # Session secret, min 32 chars — the API refuses to boot without it.
      # Generate: openssl rand -hex 32
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env next to this file — generate one with `openssl rand -hex 32`}"
      # selfhost = registration closes after the first (owner) account is created.
      DEPLOYMENT: selfhost
      # Set ALLOW_SIGNUPS=1 in .env to reopen registration (e.g. to add a household
      # member), then remove it and `docker compose up -d` again.
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-}
      # Public origin of the app. Behind TLS, SET THIS to the https:// origin you browse:
      # the session cookie's `Secure` attribute follows this URL's scheme, so leaving the
      # http://localhost default in place while serving over HTTPS issues a 90-day session
      # cookie WITHOUT `Secure` — one plain-http:// link to the same host leaks it in the
      # clear. Login itself works either way (the origin the app is served on is always
      # trusted), so nothing surfaces the mistake. Also required for Google sign-in and
      # when a reverse proxy rewrites the Host header.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Google sign-in (optional). Both unset = e-mail + password only.
      # Requires BETTER_AUTH_URL — the OAuth redirect URI is derived from it.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Optional AI (screenshot import of statements, budget suggestions). A key here
      # enables SERVER-side AI: each device still has to opt in, and the requests are
      # paid by this key. Empty = no server AI — budget suggestions fall back to local
      # rules and screenshot import is unavailable in server mode (it is AI-only).
      # This does NOT disable AI on the device: a trusted device can use its own OpenAI
      # key (BYOK, Settings → AI), and those requests go straight from the browser to
      # OpenAI, never through this server. AI is off by default; with no key set and no
      # device opting in, Enveo makes no outbound AI request at all.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
    ports:
      # bind:host:container. Loopback by default — see EXPOSURE at the top of this file.
      # ENVEO_PORT changes the host port (ENVEO_PORT=9000 → http://localhost:9000);
      # ENVEO_BIND=0.0.0.0 publishes it on every interface (LAN/NAS — deliberate choice).
      - "${ENVEO_BIND:-127.0.0.1}:${ENVEO_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8080/api/health');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
