# Render blueprint — one-click: app container + managed Postgres.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: enveo
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: off   # releases are deliberate (tags), not every push
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: enveo-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DEPLOYMENT
        value: selfhost
databases:
  - name: enveo-db
    postgresMajorVersion: "16"
    plan: basic-256mb
