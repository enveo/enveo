# Weekly dependency audit.
#
# The CI workflow already runs `security:audit` on every PR and push, which closes the merge
# gap. This one closes the OTHER gap: an advisory published while nobody is changing code.
# It runs the exact same evaluator (`bun run security:audit`) against the default branch.
#
# Deliberately minimal and read-only: it opens no issue, updates no dependency, merges nothing
# and never writes an exception. A failure is a notification that a human must triage —
# either fix the dependency or add a reviewed entry to security/audit-policy.json.
name: Security audit

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour so it does not queue behind the top-of-hour rush.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: bun audit against the reviewed policy
    runs-on: ubuntu-latest
    steps:
      # Scheduled runs always check out the default branch; that is exactly what we want to audit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in step with BUN_VERSION in ci.yml — the audit parser is written against a
          # known `bun audit --json` shape.
          bun-version: "1.3.14"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun run security:audit
