# CI: the root verification contract + the Docker image build.
#
# The gate itself lives in `verify.yml` and is CALLED from here, because the release pipeline
# calls the same file on the tagged commit (§3d). Neither workflow keeps a second, hand-written
# list of package commands, and neither can drift from `bun run verify:ci`.
#
# The browser smoke test (`bun run e2e`) is part of verify:ci; exploratory E2E with agent-browser
# stays local, against a throwaway stack.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository or to a registry.
permissions:
  contents: read

env:
  # Pinned on purpose — see verify.yml. scripts/lib/bunVersion.test.ts fails the suite if this
  # drifts from `.bun-version`.
  BUN_VERSION: "1.3.14"

jobs:
  verify:
    # `github.sha` is the right ref here: on a pull_request it is the merge commit CI is meant to
    # test, and on a push it is the pushed commit. The release path resolves its own SHA instead.
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}

  docker:
    # Catches a class of problems invisible in tests (e.g. a dependency outside `dependencies`
    # → frozen-lockfile in the image fails; historical failure mode).
    #
    # Gated on `verify` so no image is ever built from a revision that already failed types,
    # tests, the PWA build or the dependency audit.
    #
    # This is a SINGLE-ARCH build on the runner's own architecture, and it is not the release
    # gate: the release workflow builds, scans and inventories BOTH published architectures
    # (§3d carry-overs). Keeping it here makes an image break show up on the pull request.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # SOURCE_COMMIT is the release identity: `.git` is excluded from the build context, so the
      # sha cannot be recovered inside Docker. It flows into the web build stamp AND the OCI
      # revision label, and the inventory below asserts BOTH equal what was passed.
      - name: Build prod image
        run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t enveo-ci .

      # The image contract (§3e): the runtime allowlist is present, the dev/build tree is not,
      # the container is unprivileged and /app is read-only to it. Rules in
      # scripts/lib/imageInventory.ts, unit-tested in the `verify` job above.
      - name: Image inventory (runtime allowlist + non-root)
        run: bun run image:inventory enveo-ci --sha ${{ github.sha }}
