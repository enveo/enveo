services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enveo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enveo}
      POSTGRES_DB: ${POSTGRES_DB:-enveo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enveo} -d ${POSTGRES_DB:-enveo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # database reachable only on the host loopback (debug); remove to keep it inside the docker network
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

    # ── container hardening (§3e) ─────────────────────────────────────────────────────
    # The image already runs as the unprivileged `bun` user (uid 1000) with root-owned
    # application files. These four lines close what is left at the container boundary.
    #
    # `init` — a real init as PID 1: it reaps zombies and forwards SIGTERM, so `docker
    #          compose stop` is a clean shutdown instead of a 10s wait ending in SIGKILL.
    # `cap_drop: ALL` — the API opens one TCP socket on 8080 (>1024) and talks to
    #          Postgres. It needs no Linux capability at all, not even NET_BIND_SERVICE.
    # `no-new-privileges` — no setuid binary in the image can ever raise privileges.
    # `read_only` — the whole root filesystem is immutable; /tmp is the ONLY writable
    #          path, as tmpfs (RAM, wiped on restart, never a bind mount). Enveo writes
    #          no files: data lives in Postgres and the web assets are served read-only.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-enveo}:${POSTGRES_PASSWORD:-enveo}@db:5432/${POSTGRES_DB:-enveo}
      PORT: 8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      # optional, DEDICATED secret (never BETTER_AUTH_SECRET): enables the privacy-preserving
      # safety_identifier on operator OpenAI calls (aiSpend/safetyIdentifier.ts)
      AI_SAFETY_IDENTIFIER_SECRET: ${AI_SAFETY_IDENTIFIER_SECRET:-}
      # auth (mandatory accounts): the API refuses to boot without a session secret
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      DEPLOYMENT: ${DEPLOYMENT:-selfhost}
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8080/api/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # app listens only on the host loopback — expose it via a private network perimeter (e.g. VPN)
    # host:container port mapping; adjust the host port if it is already taken
    ports:
      - "127.0.0.1:8081:8080"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
