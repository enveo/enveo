# CI: the root verification contract + the Docker image build.
#
# This workflow deliberately keeps NO second, hand-written list of package commands. The gate is
# `bun run verify:ci` (typecheck → test:db → build → security:audit) — the same command a
# developer can run locally — so CI and local verification cannot drift apart. Add a phase by
# editing package.json, not this file.
#
# E2E (agent-browser) stays outside CI — it runs locally against a throwaway stack.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository or to a registry.
permissions:
  contents: read

env:
  # Pinned on purpose: the audit parser is written against a KNOWN `bun audit --json` shape,
  # and the test suites run on this runtime. A Bun bump is a reviewed change — if its output
  # schema moves, the audit gate must fail visibly rather than silently pass.
  BUN_VERSION: "1.3.14"

jobs:
  quality:
    name: verify:ci — typecheck, tests (with PostgreSQL), PWA build, dependency audit
    runs-on: ubuntu-latest
    services:
      # THROWAWAY PostgreSQL for the DB-backed suites (auth/sync/operation-lock): they migrate
      # and WRITE, so they must never see a real database. `bun run test:db` refuses to start
      # unless TEST_DATABASE_URL is set, differs from DATABASE_URL and the ack sentinel is present.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: enveo
          POSTGRES_PASSWORD: enveo
          POSTGRES_DB: enveotest
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U enveo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # bun auto-loads .env locally — absent in CI. Drizzle connections are lazy, so a dummy
      # app URL is enough; it exists mainly so the runner can prove the test URL differs from it.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      TEST_DATABASE_URL: postgres://enveo:enveo@127.0.0.1:5499/enveotest
      ENVEO_TEST_DB_ACK: throwaway
      # Explicit: the "no AI key" paths must fail for the right reason.
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      # AGENTS.md is the byte-identical public mirror of CLAUDE.md (agent-standard filename);
      # they have drifted before — this is the guard.
      - name: AGENTS.md mirrors CLAUDE.md
        run: diff -u CLAUDE.md AGENTS.md

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # The authoritative gate. Each phase announces itself in the log:
      #   "$ bun run typecheck:*"            — shared, api, web app, web tests, tooling
      #   "run-tests: mode=db …"             — the full suite with DB-backed groups REQUIRED
      #   "vite build"                       — the production PWA build
      #   "security:audit — bun audit --json"— the fail-closed dependency policy gate
      - name: Verify
        run: bun run verify:ci

  docker:
    # Catches a class of problems invisible in tests (e.g. a dependency outside `dependencies`
    # → frozen-lockfile in the image fails; historical failure mode).
    #
    # Gated on `quality` so no image is ever built from a revision that already failed types,
    # tests, the PWA build or the dependency audit.
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build prod image
        run: docker build -t enveo-ci .
